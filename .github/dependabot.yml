version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      tree-sitter:
        patterns:
          - "*tree-sitter*"
      node:
        patterns:
          - "node*"
      ajv:
        patterns:
          - "ajv*"
