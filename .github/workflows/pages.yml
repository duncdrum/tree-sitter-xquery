name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "grammar.js"
      - "src/scanner.c"
      - "queries/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let in-flight runs finish rather than
# racing a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Generate parser
        run: npx tree-sitter generate

      - name: Build the wasm grammar
        # tree-sitter-cli fetches its own wasi-sdk toolchain, no
        # Emscripten/Docker setup needed.
        run: npx tree-sitter build --wasm -o docs/tree-sitter-xquery.wasm

      - name: Copy the web-tree-sitter runtime
        # Keeps the runtime in lockstep with whatever web-tree-sitter
        # version package.json pins, alongside the freshly built grammar
        # wasm above — see the .gitignore comment for why these can't be
        # a static, hand-committed snapshot.
        run: |
          cp node_modules/web-tree-sitter/web-tree-sitter.js docs/
          cp node_modules/web-tree-sitter/web-tree-sitter.wasm docs/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
